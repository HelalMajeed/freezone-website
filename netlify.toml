# Netlify: build the Vite storefront from freezone-web (not the monorepo root).
# In Netlify UI, you can leave "Base directory" empty if this file is at repo root.

[build]
  base = "freezone-web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  SKIP_DEV_DATABASE = "1"
  SKIP_PRISMA_MIGRATE = "1"
  SKIP_WAIT_API = "1"
  VITE_API_URL = "https://freezone-website.fly.dev"

# Product/CMS images live on the Fly volume (/uploads/...). The SPA references
# them with same-origin relative paths, so Netlify must proxy /uploads/* to the
# API origin — otherwise the catch-all below returns index.html (text/html) and
# every image renders broken. Mirrors the dev Vite proxy. Must precede the
# SPA catch-all.
[[redirects]]
  from = "/uploads/*"
  to = "https://freezone-website.fly.dev/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200
  force = false

[[redirects]]
  from = "/favicon.png"
  to = "/favicon.png"
  status = 200
  force = false

[[redirects]]
  from = "/brand/*"
  to = "/brand/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
