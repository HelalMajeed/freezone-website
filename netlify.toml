# Netlify: build the Vite storefront from freezone-web (not the monorepo root).
# In Netlify UI, you can leave "Base directory" empty if this file is at repo root.

[build]
  base = "freezone-web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  SKIP_DEV_DATABASE = "1"
  SKIP_PRISMA_MIGRATE = "1"
  SKIP_WAIT_API = "1"
  VITE_API_URL = "https://freezone-website.fly.dev"

# Proxy the crawler-facing sitemap to the API's dynamic generator (built from
# the live catalog). Must come before the SPA catch-all so it isn't swallowed.
[[redirects]]
  from = "/sitemap.xml"
  to = "https://freezone-website.fly.dev/api/seo/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
