name: CI

on:
  push:
  pull_request:

jobs:
  freezone-web:
    name: freezone-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freezone-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: freezone-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          # Don't hit the live production API during CI builds; the prerender
          # postbuild step is only needed for the real deploy (deploy-web).
          PRERENDER_SKIP: "1"

  freezone-api:
    name: freezone-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freezone-api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: freezone-api/package-lock.json
      - run: npm ci
      - run: npm run routes:check
      - run: npm run test
      - run: npm run build

  freezone-storefront:
    name: freezone-storefront (scaffold)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freezone-storefront
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: freezone-storefront/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
