name: CI

on:
  push:
  pull_request:

jobs:
  freezone-web:
    name: freezone-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freezone-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: freezone-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  freezone-api:
    name: freezone-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freezone-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: freezone-api/package-lock.json
      - run: npm ci
      - run: npm run build

  commerce-admin-api:
    name: commerce-admin-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce-suite/admin-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: commerce-suite/admin-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  commerce-admin-web:
    name: commerce-admin-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce-suite/admin-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: commerce-suite/admin-web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3020/v1
