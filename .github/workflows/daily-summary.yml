name: Daily summary

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  summary:
    runs-on: ubuntu-latest
    env:
      API_URL: https://freezone-website.fly.dev
    steps:
      - name: Login + fetch recent batches
        id: fetch
        env:
          ADMIN_EMAIL: ${{ secrets.FREEZONE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.FREEZONE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ADMIN_EMAIL:?FREEZONE_ADMIN_EMAIL secret is not set}"
          : "${ADMIN_PASSWORD:?FREEZONE_ADMIN_PASSWORD secret is not set}"

          # Use the DB-backed dashboard session (fz_dashboard_session). The legacy
          # fz_admin_session HMAC cookie is rejected by /api/admin/* guards unless
          # LEGACY_ADMIN_COOKIE=true, so the old admin/login flow 401'd every day.
          login=$(curl -sS -i -X POST -H "Content-Type: application/json" \
            -d "{\"email\":\"${ADMIN_EMAIL}\",\"password\":\"${ADMIN_PASSWORD}\"}" \
            "${API_URL}/api/dashboard/auth/login")
          cookie=$(printf "%s\n" "$login" | grep -i '^set-cookie:' | grep -o 'fz_dashboard_session=[^;]*' | head -1)
          if [ -z "$cookie" ]; then echo "::error::no dashboard session cookie"; exit 1; fi

          batches=$(curl -sS -H "Cookie: $cookie" "${API_URL}/api/admin/import/globaliraq/batches?limit=50")
          echo "$batches" > /tmp/batches.json
          echo "batches_file=/tmp/batches.json" >> "$GITHUB_OUTPUT"

      - name: Build summary
        id: build
        run: |
          set -euo pipefail
          file="${{ steps.fetch.outputs.batches_file }}"
          /usr/bin/env -S node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('$file', 'utf8'));
            const batches = data.batches || [];
            const since = Date.now() - 24 * 60 * 60 * 1000;
            const recent = batches.filter((b) => new Date(b.startedAt).getTime() >= since);
            const sum = recent.reduce(
              (acc, b) => ({
                runs: acc.runs + 1,
                succeeded: acc.succeeded + (b.succeeded || 0),
                failed: acc.failed + (b.failed || 0),
                total: acc.total + (b.total || 0),
              }),
              { runs: 0, succeeded: 0, failed: 0, total: 0 },
            );
            const lines = [
              '## Last 24 hours',
              '',
              \`- Batches: \${sum.runs}\`,
              \`- Handles attempted: \${sum.total}\`,
              \`- Succeeded: \${sum.succeeded}\`,
              \`- Failed: \${sum.failed}\`,
              '',
              '## Latest 10 batches',
              '',
              ...batches.slice(0, 10).map(
                (b) => \`- \\\`\${b.id}\\\` — \${b.status} — total=\${b.total} ok=\${b.succeeded} failed=\${b.failed} (\${b.startedAt})\`,
              ),
              '',
              '> Auto-generated by .github/workflows/daily-summary.yml',
            ];
            fs.writeFileSync('/tmp/summary.md', lines.join('\\n'));
          "
          {
            echo "title=Daily summary $(date -u +%Y-%m-%d)"
            echo "body<<__END__"
            cat /tmp/summary.md
            echo "__END__"
          } >> "$GITHUB_OUTPUT"

      - name: Open daily issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `${{ steps.build.outputs.title }}`;
            const body = `${{ steps.build.outputs.body }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["daily-summary"],
            });
