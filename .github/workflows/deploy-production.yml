name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "freezone-api/**"
      - "fly.toml"
      - "freezone-api/Dockerfile"
      - ".github/workflows/deploy-production.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Fly.io API + DB migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API
        run: flyctl deploy -a freezone-website --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Prisma migrate deploy
        run: flyctl ssh console -a freezone-website -C "cd /app && npx prisma migrate deploy"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Sync classification attributes (safe)
        run: flyctl ssh console -a freezone-website -C "cd /app && npx tsx scripts/seed-classification-only.ts"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-web:
    name: Netlify storefront
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freezone-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: freezone-web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://freezone-website.fly.dev
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./freezone-web/dist
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
