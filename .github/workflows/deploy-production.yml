name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "freezone-api/**"
      - "freezone-web/**"
      - "fly.toml"
      - "freezone-api/Dockerfile"
      - ".github/workflows/deploy-production.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Gate every production deploy on the same lint/test/build checks that CI runs,
  # against the exact SHA being deployed. Without this, a push to main that fails
  # CI would still deploy (deploy-production has no dependency on the CI workflow),
  # so broken code could reach Fly/Netlify despite a red CI run.
  verify-api:
    name: Verify API (routes, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freezone-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: freezone-api/package-lock.json
      - run: npm ci
      - run: npm run routes:check
      - run: npm run test
      - run: npm run build

  verify-web:
    name: Verify web (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freezone-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: freezone-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          PRERENDER_SKIP: "1"

  deploy-api:
    name: Fly.io API + DB migrate
    needs: [verify-api, verify-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API
        run: flyctl deploy -a freezone-website --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Migrations are applied by docker-entrypoint.sh (`npx prisma migrate deploy`)
      # on every machine start, so the deployed machine migrates itself on boot.
      # A separate SSH `migrate deploy` here was redundant (and racy with boot),
      # so it has been removed — the entrypoint is the single migration path.

      # Classification repair is manual only (does not run prisma db seed).
      # After deploy, run when intended:
      #   flyctl ssh console -a freezone-website -C "cd /app && npm run classification:repair"
      # See freezone-api/scripts/README-classification-sync.md

  deploy-web:
    name: Netlify storefront
    # Gate the storefront publish on a successful API deploy + migration so a new
    # frontend never goes live against an un-migrated API.
    needs: deploy-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freezone-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: freezone-web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://freezone-website.fly.dev
          # NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID are not set, so the Netlify step
          # below is a no-op and this build is never published — the real web deploy
          # is the Netlify Git integration. Skip the postbuild prerender so it does
          # not fetch the live API while deploy-api is mid rolling-deploy: that race
          # timed out the "en" catalog fetch and flaked this whole workflow red even
          # though the API + web deploys succeeded (masking the true deploy signal).
          PRERENDER_SKIP: "1"
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./freezone-web/dist
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
