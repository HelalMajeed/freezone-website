# Manual + daily production DB backup (requires DATABASE_URL_PROD secret).
# Runs daily at 03:00 UTC to honor the documented RPO <= 24h
# (see docs/DISASTER_RECOVERY.md). Artifacts are retained for 7 days.
name: Backup production database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  pg-dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create encrypted backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL_PROD secret not set — skip backup"
            exit 0
          fi
          # The dump contains customer/order PII. GitHub Actions artifacts are
          # downloadable by anyone with repo Actions read access, so we never
          # upload a plaintext dump — encrypt it (AES-256) first and refuse to
          # run if no passphrase is configured. Decrypt with:
          #   gpg --batch --passphrase "$BACKUP_GPG_PASSPHRASE" -d file.dump.gpg > file.dump
          if [ -z "$BACKUP_GPG_PASSPHRASE" ]; then
            echo "::error::BACKUP_GPG_PASSPHRASE secret not set — refusing to produce an unencrypted dump"
            exit 1
          fi
          mkdir -p backups
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          pg_dump "$DATABASE_URL" -Fc -f "backups/freezone-prod-${stamp}.dump"
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_GPG_PASSPHRASE" \
            -o "backups/freezone-prod-${stamp}.dump.gpg" \
            "backups/freezone-prod-${stamp}.dump"
          rm -f "backups/freezone-prod-${stamp}.dump"
      - uses: actions/upload-artifact@v4
        with:
          name: freezone-db-backup
          path: backups/*.dump.gpg
          retention-days: 7
