# Production DB backup. PRIMARY path = Fly Postgres volume snapshot (needs only
# the existing FLY_API_TOKEN — no owner secret), so the daily job produces real
# disaster-recovery state instead of the old silent no-op (issue #44). The
# portable encrypted pg_dump is kept as an OPTIONAL second path that activates
# only when DATABASE_URL_PROD + BACKUP_GPG_PASSPHRASE are configured.
# Runs daily at 03:00 UTC (RPO <= 24h, see docs/DISASTER_RECOVERY.md).
name: Backup production database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: backup-database
  cancel-in-progress: false

jobs:
  fly-volume-snapshot:
    name: Fly volume snapshot (primary DR, no owner secret)
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PG_APP: freezone-website-pg
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create + list volume snapshot
        run: |
          set -euo pipefail
          VOL="$(flyctl volumes list -a "$PG_APP" --json | jq -r '.[0].id')"
          if [ -z "$VOL" ] || [ "$VOL" = "null" ]; then
            echo "::error::could not resolve a volume id for $PG_APP"
            exit 1
          fi
          echo "Creating snapshot for volume $VOL ..."
          flyctl volumes snapshots create "$VOL"
          echo "Recent snapshots:"
          flyctl volumes snapshots list "$VOL"

  pg-dump:
    name: Encrypted pg_dump (optional — needs DATABASE_URL_PROD + passphrase)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
      BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create encrypted backup (skips cleanly if secrets absent)
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${BACKUP_GPG_PASSPHRASE:-}" ]; then
            # Not a failure: the volume-snapshot job above is the active DR path.
            # This portable dump is a bonus that switches on once the owner sets
            # DATABASE_URL_PROD + BACKUP_GPG_PASSPHRASE (see docs/SECRETS_CHECKLIST.md).
            echo "::notice::DATABASE_URL_PROD/BACKUP_GPG_PASSPHRASE not set — skipping portable pg_dump (Fly volume snapshot already taken)."
            exit 0
          fi
          # The dump contains customer/order PII; artifacts are downloadable by
          # anyone with Actions read access, so encrypt (AES-256) before upload.
          #   gpg --batch --passphrase "$BACKUP_GPG_PASSPHRASE" -d file.dump.gpg > file.dump
          mkdir -p backups
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          pg_dump "$DATABASE_URL" -Fc -f "backups/freezone-prod-${stamp}.dump"
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_GPG_PASSPHRASE" \
            -o "backups/freezone-prod-${stamp}.dump.gpg" \
            "backups/freezone-prod-${stamp}.dump"
          rm -f "backups/freezone-prod-${stamp}.dump"
      - name: Upload encrypted dump (only if produced)
        if: hashFiles('backups/*.dump.gpg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: freezone-db-backup
          path: backups/*.dump.gpg
          retention-days: 7
