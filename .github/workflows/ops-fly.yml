name: Ops — Fly admin

# Operational helper for the launch runbook (FINAL_REPORT.md deploy checklist).
# Uses the repo FLY_API_TOKEN secret. No secret VALUES are ever printed:
# `flyctl secrets list` shows names + digests only, and the seed script prints
# "(set via env)" instead of the password.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operation to run"
        required: true
        type: choice
        default: "secrets-list"
        options:
          - status
          - health
          - secrets-list
          - prepare-launch
          - seed-admin
          - classification-repair
          - create-imported-brands
          - pg-snapshots
          - cancel-test-order
      orderId:
        description: "Order id for cancel-test-order"
        required: false
        default: "6"

concurrency:
  group: ops-fly
  cancel-in-progress: false

jobs:
  ops:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: freezone-website
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Read-only status (app, machines, last events, volumes, secret names)
        # Changes nothing and prints no secret values. FLY_API_TOKEN is scoped to
        # the API app, so the Postgres app (freezone-website-pg) cannot be listed
        # or inspected from here — use the `health` action to check the database
        # from inside the API machine.
        if: inputs.action == 'status'
        run: |
          set +e
          echo "== app =="
          flyctl status -a "$APP" 2>&1 | head -40
          echo "== machines =="
          flyctl machine list -a "$APP" 2>&1 | head -20
          echo "== last machine events =="
          MID="$(flyctl machine list -a "$APP" --json 2>/dev/null | jq -r '.[0].id // empty')"
          [ -n "$MID" ] && flyctl machine status "$MID" -a "$APP" 2>&1 | sed -n '/Event Logs/,$p' | head -16
          echo "== volumes =="
          flyctl volumes list -a "$APP" 2>&1 | head -10
          echo "== secret names (no values) =="
          flyctl secrets list -a "$APP" 2>&1 | awk 'NR>1 {print $1}' | head -40
          exit 0

      - name: Start the machine and check API, database and uploads from inside
        # Starts the (auto-stopping) machine, then runs a small read-only script
        # inside it. Prints only: API health, which kind of host the database is
        # on (never the address or credentials), row counts, and how many uploaded
        # files the volume holds. The machine stops again by itself when idle.
        if: inputs.action == 'health'
        run: |
          set +e
          MID="$(flyctl machine list -a "$APP" --json | jq -r '.[0].id')"
          echo "Starting machine $MID ..."
          if ! START="$(flyctl machine start "$MID" -a "$APP" 2>&1)"; then
            # Fly refuses to start machines on an account with unpaid invoices.
            echo "$START" | tail -2
            echo "::error::The machine could not be started — the API is down until Fly allows it to run."
            exit 1
          fi
          JS="$(cat <<'SCRIPT'
          const out = (k, v) => console.log(k + ": " + v);
          (async () => {
            try {
              const r = await fetch("http://127.0.0.1:4000/health", { signal: AbortSignal.timeout(8000) });
              out("api health", r.status + " " + (await r.text()).slice(0, 60));
            } catch (e) { out("api health", "not answering (" + (e.cause && e.cause.code || e.name) + ")"); }
            try {
              const u = new URL(process.env.DATABASE_URL);
              out("database host kind", u.hostname.split(".").slice(-2).join(".") + " port " + (u.port || "5432"));
            } catch { out("database host kind", "DATABASE_URL missing or not a URL"); }
            try {
              const { PrismaClient } = require("@prisma/client");
              const db = new PrismaClient();
              const [products, live, orders, customers, admins] = await Promise.all([
                db.product.count(), db.product.count({ where: { deletedAt: null } }),
                db.order.count(), db.customer.count(), db.adminUser.count(),
              ]);
              const last = await db.order.findFirst({ orderBy: { createdAt: "desc" }, select: { createdAt: true } });
              out("database rows", "products " + products + " (not deleted " + live + "), orders " + orders + ", customers " + customers + ", admin users " + admins);
              out("newest order", last ? last.createdAt.toISOString().slice(0, 10) : "none");
              await db.$disconnect();
            } catch (e) { out("database query", "failed: " + String(e.message || e).split("\n").slice(-1)[0].slice(0, 160)); }
            try {
              const fs = require("fs"), path = require("path");
              let files = 0, bytes = 0;
              const walk = (d) => { for (const n of fs.readdirSync(d, { withFileTypes: true })) { const f = path.join(d, n.name); if (n.isDirectory()) walk(f); else { files++; bytes += fs.statSync(f).size; } } };
              walk("/app/public/uploads");
              out("uploaded files", files + " files, " + Math.round(bytes / 1048576) + " MB");
            } catch (e) { out("uploaded files", "unreadable: " + e.code); }
          })();
          SCRIPT
          )"
          B64="$(printf '%s' "$JS" | base64 -w0)"
          ok=false
          for i in $(seq 1 9); do
            sleep 10
            OUT="$(flyctl ssh console -a "$APP" -C "sh -c 'cd /app && echo $B64 | base64 -d | node'" 2>&1)" || true
            if printf '%s' "$OUT" | grep -q "api health: 200"; then ok=true; break; fi
          done
          printf '%s\n' "$OUT" | grep -E "^(api health|database|newest order|uploaded files)|Error|error" | head -12
          [ "$ok" = "true" ] || echo "::warning::API did not report healthy within 90 s"
          exit 0

      - name: List Fly secret names (no values)
        if: inputs.action == 'secrets-list'
        run: flyctl secrets list -a "$APP"

      - name: Set launch secrets (boot-assertion prerequisites)
        if: inputs.action == 'prepare-launch'
        env:
          ADMIN_PASSWORD: ${{ secrets.FREEZONE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ADMIN_PASSWORD:?FREEZONE_ADMIN_PASSWORD secret is not set}"
          if [ "${#ADMIN_PASSWORD}" -lt 12 ]; then
            echo "::error::FREEZONE_ADMIN_PASSWORD is shorter than 12 chars — the API boot assertion requires >=12. Rotate the GitHub secret to a stronger value, then re-run."
            exit 1
          fi
          SESSION_SECRET="$(openssl rand -hex 32)"
          # ADMIN_PASSWORD is intentionally the same value as the GitHub secret
          # FREEZONE_ADMIN_PASSWORD so the import workflow and the seeded
          # SUPER_ADMIN keep a single owner-known credential.
          flyctl secrets set -a "$APP" \
            ADMIN_SESSION_SECRET="$SESSION_SECRET" \
            ADMIN_REQUIRE_PASSWORD=true \
            ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            ADMIN_SESSION_SAMESITE=none \
            DASHBOARD_COOKIE_SAMESITE=none \
            CUSTOMER_COOKIE_SAMESITE=none
          echo "Secrets staged; waiting for the app to come back healthy..."
          ok=false
          for i in $(seq 1 36); do
            sleep 5
            if curl -fsS --max-time 10 "https://freezone-website.fly.dev/health" | grep -q '"ok":true'; then
              ok=true
              break
            fi
          done
          if [ "$ok" != "true" ]; then
            echo "::error::API did not come back healthy after secrets set"
            exit 1
          fi

      - name: Seed dashboard SUPER_ADMIN (idempotent)
        # Runs as part of prepare-launch, or standalone via the seed-admin action.
        # The seed script reads ADMIN_PASSWORD from the machine env (Fly secret),
        # so prepare-launch must have run at least once before this.
        # tsx is a devDependency (pruned from the runner image) — npx fetches it.
        if: inputs.action == 'prepare-launch' || inputs.action == 'seed-admin'
        run: |
          set -euo pipefail
          flyctl ssh console -a "$APP" -C "sh -c 'cd /app && npx -y tsx prisma/seed-dashboard-superadmin.ts'"

      - name: Classification repair (run after catalog imports)
        if: inputs.action == 'classification-repair'
        run: |
          set -euo pipefail
          flyctl ssh console -a "$APP" -C "sh -c 'cd /app && npx -y tsx scripts/seed-classification-only.ts && npx -y tsx scripts/sync-legacy-product-specs.ts'"

      - name: Create Brand rows for imported vendors (INSERT-only, idempotent)
        # Imported products carry vendor as free-text Product.brand with brandId
        # null, so they never appear in the brand listing. This creates a Brand
        # row per distinct vendor name (script is safe to re-run). Script ships in
        # the deployed image (Dockerfile COPY scripts ./scripts).
        if: inputs.action == 'create-imported-brands'
        run: |
          set -euo pipefail
          # Fly auto-stops idle VMs and `flyctl ssh` will not start them
          # ("app has no started VMs"). Wake the machine via the public health
          # endpoint (auto-start) and wait until it serves before ssh-ing in.
          ok=false
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 "https://freezone-website.fly.dev/health" | grep -q '"ok":true'; then
              ok=true; break
            fi
            sleep 5
          done
          [ "$ok" = "true" ] || { echo "::error::API did not wake to healthy"; exit 1; }
          flyctl ssh console -a "$APP" -C "sh -c 'cd /app && node scripts/create-imported-brands.mjs --confirm'"

      - name: Cancel a test order via the admin route (audit + stock restore)
        if: inputs.action == 'cancel-test-order'
        env:
          ADMIN_PASSWORD: ${{ secrets.FREEZONE_ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ vars.FREEZONE_ADMIN_EMAIL || 'admin@freezone-iq.com' }}
          API_URL: https://freezone-website.fly.dev
          ORDER_ID: ${{ inputs.orderId }}
        run: |
          set -euo pipefail
          : "${ADMIN_PASSWORD:?FREEZONE_ADMIN_PASSWORD secret is not set}"
          jar=$(mktemp)
          login=$(jq -nc --arg id "$ADMIN_EMAIL" --arg pw "$ADMIN_PASSWORD" '{identifier:$id,email:$id,password:$pw}')
          code=$(curl -sS -o /tmp/l.json -w '%{http_code}' -c "$jar" -X POST \
            -H "Content-Type: application/json" -d "$login" "${API_URL}/api/dashboard/auth/login")
          [ "$code" = "200" ] || { echo "::error::admin login failed ($code)"; cat /tmp/l.json; exit 1; }
          cookie=$(awk '{sub(/^#HttpOnly_/,"")} !/^#/ && NF>=7 {printf "%s%s=%s", sep, $6, $7; sep="; "}' "$jar")
          resp=$(curl -sS -X POST -H "Content-Type: application/json" -H "Cookie: $cookie" \
            -d '{"reason":"launch verification test order","restoreStock":true}' \
            "${API_URL}/api/admin/orders/${ORDER_ID}/cancel")
          echo "cancel response: $resp"
          echo "$resp" | grep -q '"status":"cancelled"' || { echo "::error::cancel did not confirm"; exit 1; }

      - name: Postgres volume snapshots (disaster-recovery evidence)
        if: inputs.action == 'pg-snapshots'
        run: |
          set -euo pipefail
          flyctl volumes list -a freezone-website-pg
          VOL="$(flyctl volumes list -a freezone-website-pg --json | jq -r '.[0].id')"
          flyctl volumes snapshots list "$VOL"
