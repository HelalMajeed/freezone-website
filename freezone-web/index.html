<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=7" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png?v=7" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=7" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C90000" />
    <title>Freezone</title>
    <!-- Fonts are self-hosted (@fontsource, imported from src/main.tsx) — no
         render-blocking Google Fonts request. -->
    <style>
      :root {
        --font-inter: "Inter Variable", "Inter", system-ui, sans-serif;
        --font-ibm-arabic: "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
        --font-barlow: var(--font-inter);
        --font-barlow-condensed: var(--font-inter);
        --font-cairo: var(--font-ibm-arabic);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
