# fly.toml app configuration file generated for freezone-website on 2026-05-12T22:53:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'freezone-website'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    SERVICE_PATH = '.'

[deploy]
  strategy = 'rolling'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 4096
