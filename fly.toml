# Fly.io — freezone-api, deployed from monorepo root.
# Build context = repo root; Dockerfile copies via SERVICE_PATH=freezone-api.
#
# From repo root:
#   flyctl deploy -a freezone-website
#
# Or deploy only the API subfolder (uses freezone-api/fly.toml + context):
#   flyctl deploy ./freezone-api -a freezone-website

app = "freezone-website"
primary_region = "iad"

[env]
  API_HOST = "0.0.0.0"
  API_PORT = "4000"

[build]
  dockerfile = "freezone-api/Dockerfile"
  [build.args]
    SERVICE_PATH = "freezone-api"

[http_service]
  internal_port = 4000
  force_https = true
  # OPS-3 (docs/ENTERPRISE_GAP_AUDIT.md): keep >=1 machine always warm — removes the
  # cold-start on the first request after idle AND the single-point auto-stop outage.
  # Excess machines still auto-stop; raise to >=2 (multi-region) for true HA later.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "10s"
  grace_period = "60s"
  method = "GET"
  path = "/health"

[[vm]]
  # Explicit guest RAM (must not exceed 2048 MiB on typical Fly org limits). Prefer cpu/memory over `size` to avoid bad merges with scaled machines.
  # 2 GB: the full storefront catalog (1000+ products with relations) needs more
  # than 1 GB to load without OOM/heap-abort. Paired with --max-old-space-size in
  # the Dockerfile CMD and the in-process catalog cache.
  cpu_kind = "shared"
  cpus = 1
  memory = "2048mb"

# Admin uploads + static /uploads/* — persistent across deploys (seed from image on first boot).
[[mounts]]
  source = "uploads_data"
  destination = "/app/public/uploads"

# Re-enable after migrations succeed from SSH:
#   release_command = "npx prisma migrate deploy"
#   release_command_timeout = "10m"

[deploy]
  strategy = "rolling"
  # release_command = "npx prisma migrate deploy"
  # release_command_timeout = "10m"
